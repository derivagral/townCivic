name: Mobile TestFlight

# Build the mainline app against the shared website/API backend.
# Only dispatch reviewed repository code: the build receives EXPO_TOKEN.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Trusted repository branch, tag, or commit to build
        type: string
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: mobile-testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Check mobile workspace and record source
        run: |
          test -f apps/mobile/eas.json || { echo 'Choose a source ref containing apps/mobile.'; exit 1; }
          echo "MOBILE_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run mobile:typecheck
      - run: npm run mobile:lint
      - run: npm test -- test/mobile-api.test.ts test/mobile-client.test.ts
      - name: Check configuration and live API
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN" || { echo 'Set the EXPO_TOKEN secret.'; exit 1; }
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { build } = JSON.parse(readFileSync("apps/mobile/eas.json", "utf8"));
            const url = new URL(build.production.env.EXPO_PUBLIC_API_URL);
            if (url.protocol !== "https:" || url.username || url.password || url.pathname !== "/" || url.search || url.hash) throw Error("The production API URL in eas.json must be an HTTPS origin");
            const response = await fetch(new URL("/api/v1/catalog", url), { signal: AbortSignal.timeout(20000), redirect: "error" });
            if (!response.ok || (await response.json()).apiVersion !== 1) throw Error("Run Deploy on main to publish /api/v1 before building");
          '
      - name: Queue signed iOS build
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@24.10.0 build --platform ios --profile testflight --non-interactive --no-wait
      - name: Record handoff
        run: |
          echo '### iOS beta build queued' >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: $MOBILE_SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Follow the EAS build URL in the previous step. This workflow does not submit to Apple. After a successful build, submit that exact build ID using the command in docs/mobile.md.' >> "$GITHUB_STEP_SUMMARY"
