name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, format, test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # node:sqlite needs >= 22.5; the repo targets the 22 line.
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      # The suite runs entirely against local fixtures, so CI never reaches out
      # to the town's servers. A red test here is a real regression.
      - name: Test
        run: npm test

  smoke:
    name: seed and serve
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # End-to-end proof that a fresh checkout can build a database and answer
      # requests, without touching the network.
      - name: Seed fixtures
        run: npm run seed

      # The derived stages run over the seeded fixtures, so the smoke test
      # covers the timeline and search paths rather than only the empty states.
      # Both are offline: `link` and `interpret --provider rules` read the
      # database and nothing else.
      - name: Link and interpret
        run: |
          npm run link
          npm run interpret

      - name: Serve and check routes
        run: |
          npm run serve -- --port 8787 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8787/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          set -e
          curl -fsS http://localhost:8787/healthz > /dev/null
          curl -fsS "http://localhost:8787/?channel=land-use" > /dev/null
          curl -fsS "http://localhost:8787/?q=Pleasant&derived=1" > /dev/null
          curl -fsS http://localhost:8787/sources > /dev/null

          # Multi-town: the switcher lists every registered town, and a town
          # with no records answers with its empty state rather than 404ing.
          curl -fsS http://localhost:8787/towns -o /tmp/towns.html
          grep -q 'weymouth-ma' /tmp/towns.html || { echo "the town list is missing a town"; exit 1; }
          curl -fsS "http://localhost:8787/?town=weymouth-ma" -o /tmp/weymouth.html
          grep -q 'Weymouth, Massachusetts' /tmp/weymouth.html || { echo "switching towns did not"; exit 1; }
          curl -fsS "http://localhost:8787/feeds/all.atom?town=weymouth-ma" > /dev/null
          # The town outline is committed, so it must draw with no geocoding and
          # no network. A blank map here means the boundary failed to load.
          # /map remains a compatibility redirect; follow it so this also proves
          # old bookmarks reach the canonical Nearby view.
          curl -fsSL http://localhost:8787/map -o /tmp/map.html
          grep -q 'class="townline"' /tmp/map.html || { echo "no town outline after /map redirect"; exit 1; }
          curl -fsS http://localhost:8787/login > /dev/null

          # Which accounts backend is live is the one thing a deploy can get
          # wrong invisibly — every public record serves identically either way.
          curl -fsS http://localhost:8787/healthz | grep -q '"accounts":"sqlite"' \
            || { echo "healthz does not name the accounts backend"; exit 1; }

          # A matter page, found the way a reader would find one, so a broken
          # link between the index and the timeline fails the build.
          curl -fsS http://localhost:8787/matters -o /tmp/matters.html
          MATTER=$(grep -o '/matter/[a-f0-9]\{32\}' /tmp/matters.html | head -1)
          test -n "$MATTER" || { echo "no matters were linked"; exit 1; }
          curl -fsS "http://localhost:8787$MATTER" > /dev/null

          curl -fsS http://localhost:8787/feeds/all.atom | head -c 200
          echo
          echo "routes OK"

      # The default backend needs no configuration, so this must pass on a clean
      # checkout. It is also the command a real deploy gates on.
      - name: Check accounts
        run: npm run accounts

      # Same reasoning: the default document store needs no configuration, so
      # this must pass on a clean checkout.
      - name: Check documents
        run: npm run documents
