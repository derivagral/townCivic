name: Refresh

# The ingest → analyse cycle, run on a schedule.
#
# Twice a day, deliberately. These towns post meeting notices under a 48-hour
# clock, so a 12-hour worst case still leaves a day and a half of notice — and
# these are small municipal servers. Hourly would buy nothing and cost them
# something. Every step runs `--jurisdiction all`, so adding a town to the
# registry adds it to the schedule with no edit here; the per-host politeness
# delay in `fetch/http.ts` is what keeps several towns in one run from becoming
# a burst at any one of them.
#
# Where the state goes, now that there are two kinds of it:
#
#   the archive     `TOWNCIVIC_DOCUMENTS=s3` puts every raw document in a
#                   bucket. This is the part that cannot be regenerated — once
#                   a town takes a document down, the bucket holds the only
#                   copy — and it is the reason this job no longer depends on
#                   the Actions cache surviving.
#   the database    still the Actions cache, and still only a cache. Losing it
#                   costs a re-fetch rather than an archive: `ingest` loses its
#                   stored ETags and `extract` loses the record of what it has
#                   already opened, so the towns get asked for everything
#                   again. Slow and impolite, not destructive. Worth keeping,
#                   not worth depending on.
#
# Nothing is committed back to the repository — a binary that changes twice a
# day does not belong in git history.
#
# Accounts are deliberately absent. The pipeline never reads a user, so no
# Supabase configuration belongs in this job; that is a serve-time dependency.

on:
  schedule:
    # 07:10 and 19:10 UTC. Offset off the hour because the top of the hour is
    # the busiest slot on GitHub's scheduler and the least reliable.
    - cron: '10 7,19 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignore stored ETags and refetch everything'
        type: boolean
        default: false

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: ingest, extract, link
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Only the object store. `refresh.yml` runs on a schedule and on manual
    # dispatch, never on `pull_request`, so these are not reachable from a fork
    # — which is what keeps them out of `ci.yml`, where every contributor's
    # branch runs.
    #
    # Unset them and the job still works: `TOWNCIVIC_DOCUMENTS` falls back to
    # `local`, and the archive lives and dies with the Actions cache.
    env:
      TOWNCIVIC_DOCUMENTS: ${{ vars.S3_BUCKET && 's3' || 'local' }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
      S3_REGION: ${{ vars.S3_REGION || 'auto' }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Fail before the first request rather than after. If the bucket is
      # misconfigured, every `put` in `ingest` throws — but only after the
      # towns have already been asked for pages we then cannot store. The
      # probe is one write, read and delete against a key nothing else uses.
      - name: Check the document store
        run: npm run documents

      # Restoring the previous database is what makes this incremental:
      # conditional GETs cost the town nothing for pages that have not changed,
      # and `extract` only opens documents it has not already read.
      - name: Restore the previous database
        uses: actions/cache/restore@v4
        with:
          path: data
          key: towncivic-db-${{ github.run_id }}
          restore-keys: |
            towncivic-db-

      # Every registered town, in one pass. A town whose sources are all
      # disabled costs nothing here — it makes no requests.
      - name: Ingest
        run: npm run ingest -- --jurisdiction all

      # Documents are the slow part. Cap each run so a first run over a
      # nine-year archive spreads across several runs instead of timing out.
      - name: Extract documents
        run: npm run extract -- --jurisdiction all --limit 150

      - name: Link records into timelines
        run: npm run link -- --jurisdiction all

      - name: Read minutes
        run: npm run interpret -- --jurisdiction all

      # The only step that talks to anyone other than the town.
      - name: Geocode new addresses
        run: npm run geocode -- --jurisdiction all --limit 50
        continue-on-error: true

      - name: Save the database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: towncivic-db-${{ github.run_id }}

      # Runs even when a step above failed, so a broken run still reports what
      # state it left things in. The exit code is the alarm: a red job here
      # means a source is failing or has gone quiet.
      - name: Status
        if: always()
        run: npm run status -- --jurisdiction all

      - name: Publish the database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: towncivic-db
          path: data/towncivic.db
          retention-days: 14
          if-no-files-found: warn
