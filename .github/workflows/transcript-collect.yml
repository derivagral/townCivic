name: Collect Milton transcripts

# Opt-in: run on a machine whose network MATV accepts. This produces the same
# cumulative raw-page manifest the existing Refresh imports; never a DB snapshot.
on:
  schedule:
    - cron: '10 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matv-transcript-collector
  cancel-in-progress: false

jobs:
  collect:
    if: vars.MATV_RUNNER != ''
    # Repository variable, e.g. ["self-hosted", "matv"]. Only trusted default
    # branch code runs here. Never attach a production runner to PR workflows.
    runs-on: ${{ fromJSON(vars.MATV_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    env:
      TOWNCIVIC_DATA_DIR: ${{ runner.temp }}/towncivic-matv-${{ github.run_id }}-${{ github.run_attempt }}
      TOWNCIVIC_DB: ${{ runner.temp }}/towncivic-matv-${{ github.run_id }}-${{ github.run_attempt }}/towncivic.db
      TOWNCIVIC_DOCUMENTS: s3
      TOWNCIVIC_ACCOUNTS: sqlite
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
      S3_REGION: ${{ vars.S3_REGION || 'auto' }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --workspaces=false
      - name: Check the archive
        run: npm run documents
      - name: Restore collection checkpoint
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TOWNCIVIC_DATA_DIR }}/towncivic.db
          key: matv-collector-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            matv-collector-
      - name: Collect up to 100 posts
        run: npm run ingest -- --jurisdiction milton-ma --source milton-ma:transcripts:matv --max-pages 5
      # Also upload committed pages from a partially failed collection. Failure
      # stays red; uploading cannot advance the live synchronization checkpoint.
      - name: Upload committed pages for Refresh
        if: success() || failure()
        run: npm run transcripts:upload -- --jurisdiction milton-ma --source milton-ma:transcripts:matv
      - name: Save collection checkpoint
        if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TOWNCIVIC_DATA_DIR }}/towncivic.db
          key: matv-collector-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Remove temporary state
        if: always()
        run: rm -rf -- "$TOWNCIVIC_DATA_DIR"
