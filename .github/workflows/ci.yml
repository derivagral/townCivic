name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, format, test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # node:sqlite needs >= 22.5; the repo targets the 22 line.
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      # The suite runs entirely against local fixtures, so CI never reaches out
      # to the town's servers. A red test here is a real regression.
      - name: Test
        run: npm test

  smoke:
    name: seed and serve
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # End-to-end proof that a fresh checkout can build a database and answer
      # requests, without touching the network.
      - name: Seed fixtures
        run: npm run seed

      # The derived stages run over the seeded fixtures, so the smoke test
      # covers the timeline and search paths rather than only the empty states.
      # Both are offline: `link` and `interpret --provider rules` read the
      # database and nothing else.
      - name: Link, interpret and extract impacts
        run: |
          npm run link
          npm run interpret
          npm run impacts

      - name: Serve and check routes
        run: |
          npm run serve -- --port 8787 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8787/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          set -e
          curl -fsS http://localhost:8787/healthz > /dev/null
          curl -fsS "http://localhost:8787/?channel=land-use" > /dev/null
          curl -fsS "http://localhost:8787/?q=Pleasant&derived=1" > /dev/null
          curl -fsS http://localhost:8787/sources > /dev/null
          # The town outline is committed, so it must draw with no geocoding and
          # no network. A blank map here means the boundary failed to load.
          curl -fsS http://localhost:8787/map -o /tmp/map.html
          grep -q 'class="townline"' /tmp/map.html || { echo "no town outline on /map"; exit 1; }
          curl -fsS http://localhost:8787/login > /dev/null

          # The three views. Signed out, the two curated ones must send a
          # reader to the login page rather than rendering an empty feed.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/for-you)" = "302"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/alerts)" = "302"

          # Signed in, they render. This is the end-to-end proof that impacts,
          # preferences and ranking hold together on a fresh checkout.
          # No -L and no -X here: curl re-issues a POST on the redirect when
          # both are given, which turns the 303 to /my into a POST /my and a 404.
          curl -fsS -c /tmp/jar \
            -d 'email=smoke@example.com&password=correct-horse-battery' \
            http://localhost:8787/signup > /dev/null
          curl -fsS -b /tmp/jar http://localhost:8787/for-you -o /tmp/foryou.html
          grep -q 'For you' /tmp/foryou.html || { echo "/for-you did not render"; exit 1; }
          curl -fsS -b /tmp/jar http://localhost:8787/alerts > /dev/null
          curl -fsS -b /tmp/jar http://localhost:8787/my/setup > /dev/null
          curl -fsS -b /tmp/jar http://localhost:8787/my/preferences > /dev/null

          # The receipt under a record: extraction ran, so at least one event
          # page must show what was read out of it and the words it came from.
          curl -fsS http://localhost:8787/ -o /tmp/index.html
          FOUND=0
          for EVENT in $(grep -o '/event/[a-f0-9]\{32\}' /tmp/index.html | head -20); do
            if curl -fsS "http://localhost:8787$EVENT" | grep -q 'Who this affects'; then
              FOUND=1
              break
            fi
          done
          test "$FOUND" = "1" || { echo "no event page showed its extracted impacts"; exit 1; }

          # A matter page, found the way a reader would find one, so a broken
          # link between the index and the timeline fails the build.
          curl -fsS http://localhost:8787/matters -o /tmp/matters.html
          MATTER=$(grep -o '/matter/[a-f0-9]\{32\}' /tmp/matters.html | head -1)
          test -n "$MATTER" || { echo "no matters were linked"; exit 1; }
          curl -fsS "http://localhost:8787$MATTER" > /dev/null

          curl -fsS http://localhost:8787/feeds/all.atom | head -c 200
          echo
          echo "routes OK"
